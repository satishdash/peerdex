env: dev

storage:
  lancedb_uri: ${PEERDEX_LANCEDB_URI:-./lancedb}
  cache_uri: ${PEERDEX_CACHE_URI:-./cache}
  table_name: peer_nodes

docling:
  artifacts_path: ${DOCLING_ARTIFACTS_PATH:-./cache/docling-models}
  do_ocr: false
  do_table_structure: true
  generate_page_images: false   # we never consume full-page renders
  generate_picture_images: true
  picture_image_scale: 1.0

chunker:
  tokenizer: cl100k_base
  max_tokens: 512
  parent_chunk_tokens: 1024
  child_chunk_tokens: 256

embed:
  model: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
  dim: 1536
  batch_size: 128

llm:
  model: ${OPENAI_LLM_MODEL:-gpt-5.4-mini}
  synth_model: ${OPENAI_SYNTH_MODEL:-gpt-5.4-mini}
  judge_model: ${OPENAI_JUDGE_MODEL:-gpt-5.4-mini}

vlm:
  model: ${OPENAI_VLM_MODEL:-gpt-5.4-mini}
  cache_dir: ${PEERDEX_VLM_CACHE:-./cache/vlm-images}
  image_max_dim: 1600
  min_bbox_area_pct: 1.5
  skip_header_footer_band_pct: 8.0
  concurrency: ${PEERDEX_VLM_CONCURRENCY:-8}

resilience:
  openai_rpm: ${PEERDEX_OPENAI_RPM:-500}
  openai_tpm: ${PEERDEX_OPENAI_TPM:-200000}
  retry_attempts: 5
  timeout_seconds: 60

index:
  vector_type: ${PEERDEX_VECTOR_INDEX_TYPE:-IVF_PQ}

retrieval:
  final_top_k: 25
  query_type: ${PEERDEX_QUERY_TYPE:-vector}
  vector_refine_factor: 5

logging:
  level: ${PEERDEX_LOG_LEVEL:-INFO}
