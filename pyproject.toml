[project]
name = "peerdex"
version = "0.1.0"
description = "Production-grade RAG over peer company reports — hierarchical, cited, agentic."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Satish Dash" }]
license = { text = "Proprietary" }

dependencies = [
    # ---------- Parsing & VLM ----------
    "xberg>=1.1.5",
    "docling>=2.126.0",
    "docling-rs>=1.43.0",
    "liteparse>=2.14.4",
    "opendataloader-pdf[hybrid]>=2.5.7",
    "openai>=2.54",
    # ---------- Vector store ----------
    "lancedb>=0.38,<0.39",              # pinned: a newer writer can strand older readers
    "pyarrow>=25",
    "tantivy>=0.26",
    # ---------- RAG framework ----------
    "llama-index>=0.14.24",
    "llama-index-vector-stores-lancedb>=0.6",
    "llama-index-embeddings-openai>=0.6",
    "llama-index-llms-openai>=0.7",
    "llama-index-retrievers-bm25>=0.8",
    "tiktoken>=0.14",
    # ---------- Resilience / concurrency / rate limit ----------
    "pyresilience>=0.4",                # Retry, CircuitBreaker, Timeout, Fallback, Bulkhead
    "aiolimiter>=1.3",                  # RPM/TPM token-bucket
    # ---------- Storage abstraction ----------
    "fsspec>=2026.7",
    "gcsfs>=2026.8",                    # GCS backend (prod swap)
    # ---------- Config / schema / CLI ----------
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2",
    "typer>=0.26",
    "rich>=14.3",
    # ---------- Logging ----------
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-mock>=3.15",
    "ruff>=0.16",
    "ty>=0.0.80",
    "ipython>=9.17",
]
eval = [
    "deepeval>=4.2",                    # Faithfulness, Hallucination, GEval, ToolCorrectness
]


[project.scripts]
rag = "peerdex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peerdex"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4", "C90", "SIM", "RUF"]
ignore = ["S101"]                       # allow assert in tests

[tool.ruff.lint.mccabe]
max-complexity = 3

[tool.ruff.lint.per-file-ignores]
"src/peerdex/index/_parse_cache.py" = ["S301"]   # unpickles only our own cache
"src/peerdex/parse/_docling.py" = ["C901"]
"src/peerdex/parse/_odl.py" = ["C901"]
"src/peerdex/parse/_liteparse.py" = ["C901"]
"src/peerdex/chunk/_chunker.py" = ["C901"]
"src/peerdex/synthesize/_synth.py" = ["C901"]
"src/peerdex/shared/settings.py" = ["C901"]
"src/peerdex/shared/llm.py" = ["C901"]
"src/peerdex/vlm/_describer.py" = ["C901"]
"src/peerdex/cli.py" = ["C901"]
"src/peerdex/index/_index.py" = ["C901"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
