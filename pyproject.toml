[project]
name = "peerdex"
version = "0.1.0"
description = "Production-grade RAG over peer company reports — hierarchical, cited, agentic."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Satish Dash" }]
license = { text = "Proprietary" }

dependencies = [
    # ---------- Parsing & VLM ----------
    "xberg>=1.2.9",
    "docling>=2.130.0",
    "docling-rs>=1.69.2",
    "liteparse>=2.14.7",
    "opendataloader-pdf[hybrid]>=2.5.11",
    "openai>=3.13.0",
    # ---------- Vector store ----------
    "lancedb>=0.38.0",              # pinned: a newer writer can strand older readers
    "pyarrow>=25.0.1",
    "tantivy>=0.26.0",
    # ---------- RAG framework ----------
    "llama-index-core>=0.14.24",
    "llama-index-embeddings-openai>=0.7.0",
    "tiktoken>=0.14.0",
    "sentence-transformers>=5.1.2",
    # ---------- Resilience / concurrency / rate limit ----------
    "pyresilience>=0.4.0",                # Retry, CircuitBreaker, Timeout, Fallback, Bulkhead
    "aiolimiter>=1.3.0",                  # RPM/TPM token-bucket
    # ---------- Storage abstraction ----------
    "fsspec>=2026.7.0",
    "gcsfs>=2026.8.1",                    # GCS backend (prod swap)
    # ---------- Config / schema / CLI ----------
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.3",
    "typer>=0.26.0",
    "rich>=14.3.0",
    # ---------- Logging ----------
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
    "ipython>=9.17.1",
]
eval = [
    "deepeval>=4.2.3",                    # Faithfulness, Hallucination, GEval, ToolCorrectness
]


[project.scripts]
rag = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4", "C90", "SIM", "RUF", "D", "DOC"]
ignore = ["S101"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 3

[tool.ruff.lint.per-file-ignores]
"src/index/parse_cache.py" = ["S301", "S403"]
"src/shared/settings.py" = ["C901"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
