[project]
name = "peerdex"
version = "0.1.0"
description = "Production-grade RAG over peer company reports — hierarchical, cited, agentic."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Satish Dash" }]
license = { text = "Proprietary" }

dependencies = [
    # ---------- Parsing & VLM ----------
    "kreuzberg>=4.9",
    "docling>=2.93",
    "liteparse>=2.14",
    "opendataloader-pdf[hybrid]>=2.3.0",
    "openai>=2.36",
    # ---------- Vector store ----------
    "lancedb>=0.30",
    "pyarrow>=24",
    "tantivy>=0.25",
    # ---------- RAG framework ----------
    "llama-index>=0.14",
    "llama-index-vector-stores-lancedb>=0.5",
    "llama-index-embeddings-openai>=0.3",
    "llama-index-llms-openai>=0.3",
    "llama-index-retrievers-bm25>=0.5",
    "tiktoken>=0.7",
    # ---------- Resilience / concurrency / rate limit ----------
    "pyresilience>=0.1",                # Retry, CircuitBreaker, Timeout, Fallback, Bulkhead
    "aiolimiter>=1.1",                  # RPM/TPM token-bucket
    # ---------- Storage abstraction ----------
    "fsspec>=2024.6",
    "gcsfs>=2024.6",                    # GCS backend (prod swap)
    # ---------- Config / schema / CLI ----------
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    # ---------- Logging ----------
    "loguru>=0.7",
    "pydantic-ai[gemini,openai]>=1.92.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipython>=8.27",
]
eval = [
    "deepeval>=1.0",                    # Faithfulness, Hallucination, GEval, ToolCorrectness
]


[project.scripts]
rag = "peerdex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peerdex"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]                       # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"src/peerdex/index/_parse_cache.py" = ["S301"]   # unpickles only our own cache

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
